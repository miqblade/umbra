name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Umbra.sln -c Release
      - name: Tests
        run: dotnet run --project tests/Umbra.Tests -c Release --no-build
